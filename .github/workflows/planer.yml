name: planer

# SIN-636: ein Planer statt CEO + Vorarbeiter + Planer. Ereignisgesteuert (Merge, Fertig-Liste geändert) plus täglich 06:00 (04:00 UTC).
# Legt Issues an (Dubletten-Prüfung gegen alle Linear-Titel), plant Reihenfolge und Spuren. Der CEO entscheidet nur weiterbauen | warten | fertig.
on:
  schedule:
    - cron: "0 4 * * *" # vor dem CEO (04:10 UTC)
  workflow_run:
    workflows: [loop-merge]
    types: [completed]
  push:
    branches: [main]
    paths: [docs/FERTIG.md]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur ins Log schreiben"
        type: boolean
        default: true

concurrency:
  group: planer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  planer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Planer plant
        env:
          GH_TOKEN: ${{ secrets.AGENT_WORKFLOW_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
          VORARBEITER_PREIS_EIN_USD: ${{ vars.VORARBEITER_PREIS_EIN_USD }}
          VORARBEITER_PREIS_AUS_USD: ${{ vars.VORARBEITER_PREIS_AUS_USD }}
          KOSTEN_USD_EUR: ${{ vars.KOSTEN_USD_EUR }}
          ERGEBNIS_DATEI: /tmp/planer-ergebnis.json
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: npx tsx scripts/vorarbeiter/vorarbeiter.ts
      - name: Ergebnis gegen Schema prüfen (SIN-1045)
        run: npx tsx scripts/autonomy/schema.ts planer /tmp/planer-ergebnis.json
