# Reparatur (SIN-413): Ist `build` auf einem Claude-PR rot, bittet der Loop @claude um eine Reparatur.
# Höchstens 3 Runden (Labels repair:1 bis repair:3), danach Label needs-human und Hinweis in Linear.
name: repair

on:
  workflow_run:
    workflows: [build]
    types: [completed]

permissions:
  contents: read

jobs:
  repair:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Reparatur anstoßen oder stoppen
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GH_TOKEN: ${{ secrets.AGENT_WORKFLOW_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PRS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          LAUF: ${{ github.event.workflow_run.html_url }}
        run: |
          for pr in $(echo "$PRS" | jq -r '.[].number'); do
            npx tsx scripts/loop/loop.ts reparatur --pr "$pr" --lauf "$LAUF"
          done
