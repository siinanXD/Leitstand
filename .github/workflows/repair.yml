# Reparatur (SIN-413): Ist `build` auf einem Claude-/Codex-PR rot, bittet der Loop @claude um eine Reparatur.
# Höchstens 2 issueweite Runden (leitstand_aufgaben), danach Label needs-human und Hinweis in Linear.
name: repair

on:
  workflow_run:
    workflows: [build, pruefer]
    types: [completed]

permissions:
  contents: read

jobs:
  repair:
    # SIN-925: auch der Prüfer (pull_request_target) startet eine Reparatur, solange er nur offene Funde meldet (pruefer:offen, nie pruefer:hoch).
    if: github.event.workflow_run.conclusion == 'failure' && (github.event.workflow_run.event == 'pull_request' || (github.event.workflow_run.path == '.github/workflows/pruefer.yml' && contains(fromJSON('["pull_request_target","workflow_dispatch"]'), github.event.workflow_run.event)))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Reparatur anstoßen oder stoppen
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GH_TOKEN: ${{ secrets.AGENT_WORKFLOW_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PRS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          LAUF: ${{ github.event.workflow_run.html_url }}
          QUELLE: ${{ github.event.workflow_run.path == '.github/workflows/pruefer.yml' && 'pruefer' || 'build' }}
          # SIN-932: dispatchte Prüfer-Läufe haben keine pull_requests und laufen auf dem main-Commit; PR aus dem Laufnamen, kein Head-Abgleich.
          SHA: ${{ github.event.workflow_run.event != 'workflow_dispatch' && github.event.workflow_run.head_sha || '' }}
          TITEL: ${{ github.event.workflow_run.display_title }}
        run: |
          NUMMERN=$(echo "$PRS" | jq -r '.[].number')
          # SIN-1009: Repo und PR aus dem Laufnamen (`pruefer [owner/repo ]PR n`) liest loop.ts (pruefer-lauf.ts, nur freigegebene Repos).
          if [ -z "$NUMMERN" ]; then
            npx tsx scripts/loop/loop.ts reparatur --titel "$TITEL" --lauf "$LAUF" --quelle "$QUELLE" --sha "$SHA"
          fi
          for pr in $NUMMERN; do
            npx tsx scripts/loop/loop.ts reparatur --pr "$pr" --lauf "$LAUF" --quelle "$QUELLE" --sha "$SHA"
          done
