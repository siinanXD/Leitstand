# Prüft jeden PR: Typecheck, Lint, Unit-Tests, Build, Playwright mit axe-core (WCAG 2.2 AA).
name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      # SIN-1063: Sauberkeits-Tor nur für neuen Code (eslint-neu, knip-neu); Altlasten bleiben Warnung.
      - name: Sauberkeit (nur PR)
        if: github.event_name == 'pull_request'
        env:
          BASIS: origin/${{ github.base_ref }}
        run: npx tsx scripts/sauberkeit/pruefen.ts "$BASIS"
      # SIN-905: im PR nur die Tests der geänderten Dateien (und ihrer Importeure), auf main die volle Reihe.
      - name: Tests (PR betroffene, main alle)
        env:
          EVENT: ${{ github.event_name }}
          BASIS: origin/${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then npm test; exit $?; fi
          auswahl=$(npx tsx scripts/ci/betroffene-tests.ts "$BASIS")
          if [ "$auswahl" = "ALLE" ]; then npm test
          elif [ -z "$auswahl" ]; then echo "Keine betroffenen Tests."
          else echo "$auswahl" | xargs node --import tsx --test; fi
      - name: SIN-854 - Gate und Reparatur-CLI gegen isolierte API-Fixtures abnehmen
        run: node --import tsx --test src/lib/loop/beleg-stand.test.ts src/lib/loop/merge-gate.test.ts src/lib/loop/repair-cli.test.ts
      - name: E2E-Workflow-Vertrauensgrenze (auch bei reinen YAML-Änderungen)
        run: node --import tsx --test src/lib/e2e/workflow.test.ts
      - name: Aufbauphase-Gate mit Altfristen und Schutzgrenzen simulieren (SIN-855)
        run: DRY_RUN=1 node scripts/loop/aufbauphase-probe.mjs
      - run: npm run build
      - name: Parallel-Auswahl (isolierte CLI-Probe, kein Live-Start)
        run: DRY_RUN=1 PROBE_BERICHT=/tmp/leitstand-parallel-probe.json node scripts/loop/parallel-probe.mjs
      - name: Abnahme-Proben (Trockenlauf)
        run: DRY_RUN=1 npx tsx scripts/abnahme/abnahme.ts
      - name: Score (Trockenlauf)
        run: DRY_RUN=1 npx tsx scripts/score/score.ts
      - name: Bestandsabgleich (Trockenlauf)
        run: DRY_RUN=1 npx tsx scripts/bestand/probe.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y
