name: agent-testnutzer

# SIN-913: Playwright-Smoke mit der Sitzung des Agent-Testkontos (nur lesen). Die Sitzung lebt nur im Job; als Artefakt geht nur der Screenshot.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur Konfiguration prüfen, kein Netz"
        type: boolean
        default: true
  pull_request:
    paths:
      - "src/lib/agent-testnutzer/**"
      - "scripts/agent-testnutzer/**"
      - "e2e/agent-testnutzer.spec.ts"
      - ".github/workflows/agent-testnutzer.yml"

concurrency:
  group: agent-testnutzer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      AGENT_TESTNUTZER_EMAIL: ${{ vars.AGENT_TESTNUTZER_EMAIL }}
      LEITSTAND_URL: ${{ secrets.LEITSTAND_URL || vars.LEITSTAND_URL }}
      DRY_RUN: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Sitzung des Testkontos bauen (Trockenlauf prüft nur die Konfiguration)
        run: npx tsx scripts/agent-testnutzer/sitzung.ts "$RUNNER_TEMP/agent-sitzung.json"
      - name: Smoke eingeloggt
        if: env.DRY_RUN != 'true'
        env:
          AGENT_STORAGE_STATE: ${{ runner.temp }}/agent-sitzung.json
          PLAYWRIGHT_BASE_URL: ${{ secrets.LEITSTAND_URL || vars.LEITSTAND_URL }}
        run: |
          npx playwright install --with-deps chromium
          npx playwright test e2e/agent-testnutzer.spec.ts --output "$RUNNER_TEMP/pw"
      - name: Screenshot (ohne Sitzung)
        if: env.DRY_RUN != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: uebersicht-eingeloggt
          path: ${{ runner.temp }}/pw/**/uebersicht.png
          if-no-files-found: error
