# Auto-Merge (Squash) für fertige PRs: GitHub mergt erst, wenn der Pflicht-Check `build` grün ist (Ruleset "main schützen").
# Regeln (Sinan, 13.10.2026, wie SIN-547 in der Lern-App):
#   - Standard: Auto-Merge, auch bei Workflow-Änderungen (Schritte, Skripte, Zeitpläne, bekannte Secrets).
#   - `risk:high` (wartet auf Label `freigegeben`): Workflow-Rechte erweitert (`permissions` mit write), neues Secret, das kein
#     Workflow auf main nutzt, `pull_request_target` neu, Drittanbieter-Action außerhalb von actions/* und anthropics/*,
#     Änderung am Gate selbst (automerge.yml), Datenverlust in Migrationen (drop/delete/truncate/alter … drop|rename), Auth/Middleware, Service-Role-Key im Client.
#   - Ein gesetztes `risk:high` senkt das Gate nie. Neue/umbenannte/kopierte Workflows werden komplett geprüft (SIN-623).
#   - Einspruchsfrist (SIN-812): `risk:low` (nur Doku/Tests) sofort, `risk:medium` 30 Min nach dem letzten Commit, `risk:high` nur mit `freigegeben`.
#   - Belege (SIN-854): Bei claude/- und codex/-PRs zählt nur ein Prüfer-Beleg für den aktuellen Head und den heutigen Kriterien-Text
#     des Issues (scripts/loop/beleg-stand.mjs, von main). Neuer Commit oder geänderte Kriterien: Merge gesperrt bis zur neuen Runde.
#   - Nie: Draft-PRs, Label `no-automerge`.
# Der Grund steht als Kommentar im PR und im Leitstand (wartende PRs).
name: automerge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # pull_request_target checkt den Basis-Branch aus, nie den PR-Code.
      - uses: actions/checkout@v4
      - name: Risiko bestimmen, Auto-Merge einschalten oder ausschalten
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.AGENT_WORKFLOW_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const labels = (pr.labels || []).map((l) => l.name);
            const files = await github.paginate(github.rest.pulls.listFiles, { ...context.repo, pull_number: pr.number, per_page: 100 });

            // Bekannte Secrets: alles, was ein Workflow auf main schon nutzt.
            let bekannt = new Set();
            try {
              const { data: liste } = await github.rest.repos.getContent({ ...context.repo, path: ".github/workflows", ref: "main" });
              for (const eintrag of Array.isArray(liste) ? liste : []) {
                const { data } = await github.rest.repos.getContent({ ...context.repo, path: eintrag.path, ref: "main" });
                const text = Buffer.from(data.content, "base64").toString("utf8");
                for (const m of text.matchAll(/secrets\.([A-Za-z0-9_]+)/g)) bekannt.add(m[1]);
              }
            } catch (e) { core.warning(`Secrets auf main nicht lesbar: ${e.message}`); }

            // Neue/umbenannte/kopierte Workflows haben ggf. keine "+"-Zeilen: voller Inhalt vom PR-Head (SIN-623).
            const { brauchtInhalt, stufe, wartezeitMs } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/loop/risiko.mjs`);
            for (const f of files) {
              if (!brauchtInhalt(f)) continue;
              const { data } = await github.rest.repos.getContent({ owner: pr.head.repo.owner.login, repo: pr.head.repo.name, path: f.filename, ref: pr.head.sha });
              f.inhalt = Buffer.from(data.content, "base64").toString("utf8");
            }
            const { gruende, stufe: st } = stufe({ files, bekannt, labels });
            const high = st === "high";

            const risk = `risk:${st}`;
            const vorhandene = labels.filter((l) => l.startsWith("risk:"));
            if (!vorhandene.includes(risk)) {
              for (const alt of vorhandene) await github.rest.issues.removeLabel({ ...context.repo, issue_number: pr.number, name: alt }).catch(() => {});
              await github.rest.issues.addLabels({ ...context.repo, issue_number: pr.number, labels: [risk] }).catch((e) => core.warning(`Label: ${e.message}`));
            }
            if (high && !labels.includes("freigegeben")) {
              const kopf = "<!-- automerge-risiko -->";
              const body = `${kopf}\n**Wartet auf Sinan (risk:high).** Auto-Merge erst mit Label \`freigegeben\`.\n\n${gruende.map((g) => `- ${g}`).join("\n")}`;
              const { data: kommentare } = await github.rest.issues.listComments({ ...context.repo, issue_number: pr.number, per_page: 100 });
              const alt = kommentare.find((k) => (k.body || "").startsWith(kopf));
              if (alt) await github.rest.issues.updateComment({ ...context.repo, comment_id: alt.id, body });
              else await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body });
            }

            // Einspruchsfrist (SIN-812): low sofort, medium 30 Min nach dem letzten Commit; danach Draft, Labels und Head neu prüfen.
            let aktuell = pr;
            const warte = high ? 0 : wartezeitMs(st, (await github.rest.git.getCommit({ ...context.repo, commit_sha: pr.head.sha })).data.committer.date);
            if (warte) {
              core.info(`Einspruchsfrist: ${Math.ceil(warte / 60000)} Min bis zum Merge (${risk}).`);
              await new Promise((r) => setTimeout(r, warte));
              aktuell = (await github.rest.pulls.get({ ...context.repo, pull_number: pr.number })).data;
              if (aktuell.head.sha !== pr.head.sha || aktuell.state !== "open") return core.info("PR geändert oder geschlossen, der neue Lauf übernimmt.");
              labels.splice(0, labels.length, ...aktuell.labels.map((l) => l.name));
            }
            pr.draft = aktuell.draft;

            // Aktuelle Belege (SIN-854): Prüfer-Stand muss zum PR-Head und zum heutigen Kriterien-Text passen. Logik von main, kein PR-Code.
            let belegOk = true;
            if (/^(claude|codex)\//.test(pr.head.ref)) {
              const { belegAktuell, kriterienHash, leseStand } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/loop/beleg-stand.mjs`);
              const issueNr = /Closes #(\d+)/i.exec(aktuell.body || "")?.[1];
              const issueText = issueNr ? (await github.rest.issues.get({ ...context.repo, issue_number: Number(issueNr) })).data.body : "";
              let pruef = { ok: false, grund: "" };
              // Prüfer läuft parallel; ohne Beleg höchstens 10 Min warten, dann bleibt der Merge gesperrt.
              for (let i = 0; i < 20; i++) {
                const kommentare = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: pr.number, per_page: 100 });
                pruef = belegAktuell({ stand: leseStand(kommentare.filter((k) => ["github-actions[bot]", context.repo.owner].includes(k.user?.login)).map((k) => k.body || "")), headSha: aktuell.head.sha, hash: kriterienHash(issueText) });
                if (pruef.ok || i === 19) break;
                await new Promise((r) => setTimeout(r, 30000));
              }
              belegOk = pruef.ok;
              if (!belegOk) core.warning(`Kein Merge: ${pruef.grund}`);
            }
            const allowed = !pr.draft && belegOk && !labels.includes("no-automerge") && (!high || labels.includes("freigegeben"));
            const gql = github.graphql;
            if (allowed) {
              await gql(`mutation($id: ID!) { enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: SQUASH}) { clientMutationId } }`, { id: pr.node_id })
                .then(() => core.info(`Auto-Merge an (${risk}).`))
                .catch(async (e) => {
                  // Alle Pflicht-Checks schon grün: GitHub lehnt Auto-Merge ab, also direkt mergen.
                  if (!/(clean|unstable) status/i.test(e.message)) return core.warning(`Auto-Merge nicht gesetzt: ${e.message}`);
                  await github.rest.pulls.merge({ ...context.repo, pull_number: pr.number, merge_method: "squash", sha: pr.head.sha })
                    .then(() => core.info(`Direkt gemergt (${risk}, clean status).`))
                    .catch((m) => core.warning(`Direkt-Merge fehlgeschlagen: ${m.message}`));
                });
            } else {
              await gql(`mutation($id: ID!) { disablePullRequestAutoMerge(input: {pullRequestId: $id}) { clientMutationId } }`, { id: pr.node_id })
                .then(() => core.info(`Auto-Merge aus (${pr.draft ? "Draft" : labels.includes("no-automerge") ? "no-automerge" : "risk:high ohne freigegeben"}).`))
                .catch(() => core.info("Auto-Merge war nicht an."));
            }
