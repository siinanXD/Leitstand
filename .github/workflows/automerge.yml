# Auto-Merge (Squash) für fertige PRs: GitHub mergt erst, wenn der Pflicht-Check `build` grün ist (Ruleset "main schützen").
# Ausnahmen: Draft-PRs, Label `no-automerge`, und PRs, die .github/workflows/ ändern (die bleiben für Sinan).
name: automerge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-Merge einschalten oder ausschalten
        uses: actions/github-script@v7
        env:
          AGENT_TOKEN: ${{ secrets.AGENT_WORKFLOW_TOKEN }}
        with:
          github-token: ${{ secrets.AGENT_WORKFLOW_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const labels = (pr.labels || []).map((l) => l.name);
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: pr.number, per_page: 100,
            });
            const workflowChange = files.some((f) => f.filename.startsWith(".github/workflows/"));
            const allowed = !pr.draft && !labels.includes("no-automerge") && !workflowChange;
            const gql = github.graphql;
            if (allowed) {
              await gql(`mutation($id: ID!) { enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: SQUASH}) { clientMutationId } }`, { id: pr.node_id })
                .then(() => core.info("Auto-Merge an."))
                .catch((e) => core.warning(`Auto-Merge nicht gesetzt: ${e.message}`));
            } else {
              await gql(`mutation($id: ID!) { disablePullRequestAutoMerge(input: {pullRequestId: $id}) { clientMutationId } }`, { id: pr.node_id })
                .then(() => core.info("Auto-Merge aus (Draft, no-automerge oder Workflow-Änderung)."))
                .catch(() => core.info("Auto-Merge war nicht an."));
            }
