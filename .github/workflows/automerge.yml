# Auto-Merge (Squash) für fertige PRs: GitHub mergt erst, wenn der Pflicht-Check `build` grün ist (Ruleset "main schützen").
# Regeln (Sinan, 13.10.2026, wie SIN-547 in der Lern-App):
#   - Standard: Auto-Merge, auch bei Workflow-Änderungen (Schritte, Skripte, Zeitpläne, bekannte Secrets).
#   - `risk:high` (wartet auf Label `freigegeben`): Workflow-Rechte erweitert (`permissions` mit write), neues Secret, das kein
#     Workflow auf main nutzt, `pull_request_target` neu, Drittanbieter-Action außerhalb von actions/* und anthropics/*,
#     Änderung am Gate selbst (automerge.yml), Datenverlust in Migrationen (drop/delete/truncate/alter … drop|rename), Auth/Middleware, Service-Role-Key im Client.
#   - Ein gesetztes `risk:high` senkt das Gate nie. Neue/umbenannte/kopierte Workflows werden komplett geprüft (SIN-623).
#   - Einspruchsfrist (SIN-812): `risk:low` (nur Doku/Tests) sofort, `risk:medium` 30 Min nach dem letzten Commit, `risk:high` nur mit `freigegeben`.
#   - Nie: Draft-PRs, Label `no-automerge`.
# Der Grund steht als Kommentar im PR und im Leitstand (wartende PRs).
name: automerge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled, edited]
  workflow_run:
    workflows: [build, pruefer]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: automerge-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

jobs:
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # pull_request_target checkt den Basis-Branch aus, nie den PR-Code.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Risiko bestimmen, Auto-Merge einschalten oder ausschalten
        uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ secrets.AGENT_WORKFLOW_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        with:
          github-token: ${{ secrets.AGENT_WORKFLOW_TOKEN }}
          script: |
            const number = context.payload.pull_request?.number || context.payload.workflow_run?.pull_requests?.[0]?.number;
            if (!number) return core.info('Kein zugeordneter PR; nichts mergen.');
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: number});
            // Keine verzögerte Freigabe: bestehendes Auto-Merge zuerst ausschalten, auch bei Lesefehlern danach.
            await github.graphql(`mutation($id: ID!) { disablePullRequestAutoMerge(input: {pullRequestId: $id}) { clientMutationId } }`, {id: pr.node_id});
            const {data: main} = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            if (!main.protected || main.commit.sha !== context.sha || pr.base.sha !== context.sha || pr.base.ref !== 'main' || pr.head.repo?.full_name !== pr.base.repo?.full_name) throw new Error('Unvertrauenswürdiger oder veralteter Basisstand');
            if (context.payload.workflow_run && context.payload.workflow_run.name !== 'pruefer' && context.payload.workflow_run.head_sha !== pr.head.sha) return core.info('Veralteter Workflow-Lauf.');

            const labels = (pr.labels || []).map((l) => l.name);
            const files = await github.paginate(github.rest.pulls.listFiles, { ...context.repo, pull_number: pr.number, per_page: 100 });

            // Bekannte Secrets: alles, was ein Workflow auf main schon nutzt.
            let bekannt = new Set();
            try {
              const { data: liste } = await github.rest.repos.getContent({ ...context.repo, path: ".github/workflows", ref: "main" });
              for (const eintrag of Array.isArray(liste) ? liste : []) {
                const { data } = await github.rest.repos.getContent({ ...context.repo, path: eintrag.path, ref: "main" });
                const text = Buffer.from(data.content, "base64").toString("utf8");
                for (const m of text.matchAll(/secrets\.([A-Za-z0-9_]+)/g)) bekannt.add(m[1]);
              }
            } catch (e) { core.warning(`Secrets auf main nicht lesbar: ${e.message}`); }

            // Neue/umbenannte/kopierte Workflows haben ggf. keine "+"-Zeilen: voller Inhalt vom PR-Head (SIN-623).
            const { brauchtInhalt, stufe, wartezeitMs } = await import("./scripts/loop/risiko.mjs");
            for (const f of files) {
              if (!brauchtInhalt(f)) continue;
              const { data } = await github.rest.repos.getContent({ owner: pr.head.repo.owner.login, repo: pr.head.repo.name, path: f.filename, ref: pr.head.sha });
              f.inhalt = Buffer.from(data.content, "base64").toString("utf8");
            }
            const { gruende, stufe: st } = stufe({ files, bekannt, labels });
            const high = st === "high";

            const risk = `risk:${st}`;
            const vorhandene = labels.filter((l) => l.startsWith("risk:"));
            if (!vorhandene.includes(risk)) {
              for (const alt of vorhandene) await github.rest.issues.removeLabel({ ...context.repo, issue_number: pr.number, name: alt }).catch(() => {});
              await github.rest.issues.addLabels({ ...context.repo, issue_number: pr.number, labels: [risk] }).catch((e) => core.warning(`Label: ${e.message}`));
            }
            if (high && !labels.includes("freigegeben")) {
              const kopf = "<!-- automerge-risiko -->";
              const body = `${kopf}\n**Wartet auf Sinan (risk:high).** Auto-Merge erst mit Label \`freigegeben\`.\n\n${gruende.map((g) => `- ${g}`).join("\n")}`;
              const { data: kommentare } = await github.rest.issues.listComments({ ...context.repo, issue_number: pr.number, per_page: 100 });
              const alt = kommentare.find((k) => (k.body || "").startsWith(kopf));
              if (alt) await github.rest.issues.updateComment({ ...context.repo, comment_id: alt.id, body });
              else await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body });
            }

            const allowed = pr.state === 'open' && !pr.draft && !labels.includes('no-automerge') && !labels.includes('needs-human') && (!high || labels.includes('freigegeben'));
            if (!allowed) return core.info('Merge gesperrt: Draft, Stopp oder Freigabe fehlt.');
            const warte = high ? 0 : wartezeitMs(st, (await github.rest.git.getCommit({...context.repo, commit_sha: pr.head.sha})).data.committer.date);
            if (!Number.isFinite(warte)) throw new Error('Ungültiger Commit-Zeitpunkt; keine Merge-Freigabe');
            if (warte > 0) {
              core.info(`Einspruchsfrist: ${Math.ceil(warte / 60000)} Min (${risk}).`);
              await new Promise(resolve => setTimeout(resolve, warte));
              const {data: nachFrist} = await github.rest.pulls.get({...context.repo, pull_number: pr.number});
              if (nachFrist.head.sha !== pr.head.sha || nachFrist.base.sha !== pr.base.sha || nachFrist.draft || nachFrist.state !== 'open' || nachFrist.title !== pr.title || nachFrist.body !== pr.body || JSON.stringify(nachFrist.labels) !== JSON.stringify(pr.labels)) return core.info('PR während Einspruchsfrist geändert; neue Prüfung erforderlich.');
            }
            const checks = await github.paginate(github.rest.checks.listForRef, {...context.repo, ref: pr.head.sha, per_page: 100});
            const build = checks.filter(c => c.name === 'build' && c.app?.slug === 'github-actions').sort((a,b) => b.id-a.id)[0];
            if (!build || build.status !== 'completed' || build.conclusion !== 'success') return core.info('Aktueller build nicht grün.');
            const {execFileSync} = require('node:child_process');
            const output = execFileSync(process.execPath, ['--import', 'tsx', 'scripts/loop/loop.ts', 'merge-pruefen', '--pr', String(pr.number)], {encoding: 'utf8', env: process.env});
            core.info(output);
            const gate = JSON.parse(output.trim().split('\n').at(-1));
            if (!gate.allowed || gate.head !== pr.head.sha || gate.basis !== pr.base.sha) return core.info('Merge gesperrt: aktuelle Kriterien nicht vollständig belegt.');
            const {data: aktuell} = await github.rest.pulls.get({...context.repo, pull_number: pr.number});
            if (aktuell.state !== 'open' || aktuell.draft || aktuell.head.sha !== gate.head || aktuell.base.sha !== gate.basis || aktuell.title !== pr.title || aktuell.body !== pr.body || JSON.stringify(aktuell.labels) !== JSON.stringify(pr.labels)) throw new Error('PR während Abschlussprüfung geändert');
            // Kein enablePullRequestAutoMerge: später geänderte Linear-Kriterien dürfen keine wartende Freigabe erben.
            await github.rest.pulls.merge({...context.repo, pull_number: pr.number, merge_method: 'squash', sha: gate.head});
