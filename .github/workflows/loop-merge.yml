# Nach jedem Merge (SIN-413): Linear-Issue aus dem PR-Titel auf Done, dann sofort das nächste Issue starten.
name: loop-merge

on:
  pull_request:
    types: [closed]

concurrency:
  group: dispatch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gemergt:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      GH_TOKEN: ${{ secrets.AGENT_WORKFLOW_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LOOP_MAX_PARALLEL: ${{ vars.LOOP_MAX_PARALLEL || '1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Linear auf Done
        run: npx tsx scripts/loop/loop.ts gemergt --pr ${{ github.event.pull_request.number }}
      - name: Nächstes Issue starten
        run: npx tsx scripts/loop/loop.ts dispatch
