# Prüfer mit zweitem Modell (SIN-639, SIN-827): OpenAI API prüft Claude- und Codex-PRs.
# Ergebnis als PR-Kommentar. Echte Risiken setzen risk:high + Marker pruefer:hoch, andere Funde pruefer:offen (SIN-909).
# „Bestanden“ entfernt nur pruefer:offen; risk:high senkt allein das Gate (automerge.yml), und nur mit Marker. Kosten landen in loop_events.
# Prüfer/Abhängigkeiten vom Basis-Commit; PR-Commits werden nur als Diff gelesen, nie ausgecheckt.
name: pruefer
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: PR-Nummer (Trockenlauf ohne OpenAI)
        required: true
      pruefen:
        description: Echte erneute Prüfung des aktuellen Linear-Auftrags
        type: boolean
        default: false
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: pruefer-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true
jobs:
  pruefen:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || ((startsWith(github.head_ref, 'claude/') || startsWith(github.head_ref, 'codex/')) && github.event.pull_request.head.repo.full_name == github.repository && ((github.event.action == 'edited' && github.event.changes.base) || (!github.event.pull_request.draft && github.event.action != 'edited'))))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - id: ziel
        name: PR-Ziel validieren
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            if (!['pull_request_target', 'workflow_dispatch'].includes(context.eventName) || context.ref !== 'refs/heads/main' || context.payload.repository?.default_branch !== 'main') throw new Error('Workflow muss von main stammen');
            if (!/^[1-9][0-9]*$/.test(process.env.PR || '')) throw new Error('Ungültige PR-Nummer');
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: Number(process.env.PR)});
            const repo = `${context.repo.owner}/${context.repo.repo}`.toLowerCase();
            if (pr.state !== 'open' || pr.head.repo?.full_name.toLowerCase() !== repo || pr.base.repo?.full_name.toLowerCase() !== repo) throw new Error('Nur offene PRs aus demselben Repository');
            if (!/^(claude|codex)\//.test(pr.head.ref)) throw new Error('Kein unterstützter Worker-Branch');
            if (context.eventName !== 'workflow_dispatch' && pr.draft) throw new Error('Draft wird nicht geprüft');
            const eventPr = context.payload?.pull_request;
            if (eventPr && (eventPr.head.sha !== pr.head.sha || eventPr.base.sha !== pr.base.sha)) throw new Error('PR-Ereignis veraltet: Head oder Basis hat sich geändert');
            if (pr.base.ref !== 'main') throw new Error('Nur main als PR-Basis zulässig');
            const {data: branch} = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            if (!branch.protected) throw new Error('main ist nicht geschützt');
            if (branch.commit.sha !== context.sha) throw new Error('Workflow muss den aktuellen geschützten main-Commit verwenden');
            // PR-Metadaten können noch den früheren main-Stand nennen; sie bestimmen nie den ausführbaren Prüfer.
            for (const [name, sha] of [['basis', branch.commit.sha], ['head', pr.head.sha], ['pr_basis', pr.base.sha]]) {
              if (!/^[a-f0-9]{40}$/i.test(sha)) throw new Error('Ungültige Commit-SHA');
              core.setOutput(name, sha);
            }
      - name: Alte Prüfung bei Basiswechsel entwerten
        if: always() && github.event_name == 'pull_request_target' && github.event.changes.base
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const comments = await github.paginate(github.rest.issues.listComments, {...context.repo, issue_number: Number(process.env.PR)});
            for (const c of comments.filter(c => ['github-actions[bot]', context.repo.owner].includes(c.user?.login) && c.body?.startsWith('<!-- pruefer-zweites-modell -->'))) {
              await github.rest.issues.updateComment({...context.repo, comment_id: c.id, body: '<!-- pruefer-zweites-modell -->\n\nBasis geändert: frühere Prüfung ungültig. Neue unabhängige Prüfung ausstehend.'});
            }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.ziel.outputs.basis }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Vertrauenswürdige Prüfer-Version vorhanden
        # Beim ersten Einführen fehlt der gehärtete Prüfer noch auf der Basis: stoppen, nie den alten CLI mit leerem Diff ausführen.
        run: test -f src/lib/pruefer/git.ts
      - name: PR-Objekte nur zum Lesen laden
        env:
          GH_TOKEN: ${{ secrets.AGENT_WORKFLOW_TOKEN }}
          BASE_SHA: ${{ steps.ziel.outputs.basis }}
          HEAD_SHA: ${{ steps.ziel.outputs.head }}
        run: git -c credential.helper='!gh auth git-credential' fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
      - id: lauf
        run: |
          node --import tsx scripts/pruefer/pruefer.ts "$PR" "$BASE_SHA" "$HEAD_SHA"
        env:
          GH_TOKEN: ${{ secrets.AGENT_WORKFLOW_TOKEN }}
          BASE_SHA: ${{ steps.ziel.outputs.basis }}
          HEAD_SHA: ${{ steps.ziel.outputs.head }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && !inputs.pruefen && '1' || '' }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PRUEFER_CLAUDE_MODELL: ${{ vars.PRUEFER_CLAUDE_MODELL }}
          PRUEFER_MODELL: ${{ vars.PRUEFER_MODELL }}
          PRUEFER_PREIS_EIN: ${{ vars.PRUEFER_PREIS_EIN }}
          PRUEFER_PREIS_AUS: ${{ vars.PRUEFER_PREIS_AUS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        continue-on-error: true
      - name: Kommentar und risk:high
        if: always() && hashFiles('pruefer-kommentar.md') != ''
        env:
          GH_TOKEN: ${{ secrets.AGENT_WORKFLOW_TOKEN }}
          BASE_SHA: ${{ steps.ziel.outputs.basis }}
          HEAD_SHA: ${{ steps.ziel.outputs.head }}
          PR_BASE_SHA: ${{ steps.ziel.outputs.pr_basis }}
        run: |
          AKTUELL=$(gh api "repos/${{ github.repository }}/pulls/$PR" --jq '[.head.sha, .base.sha, .base.ref, .head.repo.full_name, .base.repo.full_name, .state] | join(" ")')
          MAIN=$(gh api "repos/${{ github.repository }}/branches/main" --jq '[.commit.sha, .protected] | join(" ")')
          if [ "$AKTUELL" != "$HEAD_SHA $PR_BASE_SHA main ${{ github.repository }} ${{ github.repository }} open" ] || [ "$MAIN" != "$BASE_SHA true" ]; then
            echo 'Prüfergebnis veraltet: Head oder Basis geändert'
            exit 1
          fi
          ALT=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate --jq '.[] | select((.user.login == "${{ github.repository_owner }}" or .user.login == "github-actions[bot]") and ((.body // "") | startswith("<!-- pruefer-zweites-modell -->\n"))) | .id' | tail -n 1)
          if [ -n "$ALT" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$ALT" -F body=@pruefer-kommentar.md
          else
            gh pr comment "$PR" --body-file pruefer-kommentar.md
          fi
          # SIN-909: risk:high nur bei echtem Risiko, mit Marker pruefer:hoch (nur wenn kein von Hand gesetztes risk:high da ist);
          # sonst pruefer:offen. Bestanden entfernt nur pruefer:offen, nie risk:high (das senkt allein das Gate).
          if [ "${{ github.event_name }}" = "pull_request_target" -o "${{ inputs.pruefen }}" = "true" ]; then
            LABELS=$(gh api "repos/${{ github.repository }}/issues/$PR/labels" --jq '.[].name') \
              node --import tsx scripts/pruefer/labels.ts | while read -r AKTION LABEL; do
                if [ "$AKTION" = add ]; then
                  gh label create "$LABEL" --color 6e7681 --description "Prüfer (SIN-909)" 2>/dev/null || true
                  gh pr edit "$PR" --add-label "$LABEL"
                else
                  gh pr edit "$PR" --remove-label "$LABEL" || true
                fi
              done
          fi
      - name: Rot, wenn nicht bestanden oder Lauf gescheitert
        if: steps.lauf.outcome == 'failure'
        run: exit 1
