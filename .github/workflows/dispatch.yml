# Loop des Leitstands (SIN-413): startet Todo-Issues aus Linear (Projekt „Leitstand“, Label `claude`).
# Weg: Linear-Issue → GitHub-Issue mit Label `claude` → claude.yml baut den PR → build → automerge.
# Läuft alle 2 Stunden, von Hand und direkt nach jedem Merge (loop-merge.yml).
name: dispatch

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur anzeigen, nichts starten"
        type: boolean
        default: false

concurrency:
  group: dispatch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Nächstes Issue starten
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GH_TOKEN: ${{ secrets.AGENT_WORKFLOW_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LOOP_MAX_PARALLEL: ${{ vars.LOOP_MAX_PARALLEL || '1' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: npx tsx scripts/loop/loop.ts dispatch
