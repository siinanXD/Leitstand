name: Infisical single-secret read smoke test

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Infisical environment slug to test (default: dev)"
        type: string
        required: true
        default: dev
      secret_path:
        description: "Infisical folder path (default: /leitstand; Lernapp: /content-agent-lernapp)"
        type: string
        required: true
        default: /leitstand

permissions:
  contents: read
  id-token: write

jobs:
  secret-read-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Authenticate with OIDC and check one secret without exposing values
        env:
          INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}
          INFISICAL_ENVIRONMENT: ${{ inputs.environment }}
          INFISICAL_SECRET_PATH: ${{ inputs.secret_path }}
          OIDC_AUDIENCE: https://github.com/siinanXD
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          (async () => {
            const identityId = process.env.INFISICAL_IDENTITY_ID;
            if (!identityId || !/^[0-9a-f-]{36}$/i.test(identityId)) {
              throw new Error('Identity variable missing or invalid');
            }
            const environment = process.env.INFISICAL_ENVIRONMENT;
            if (!/^[a-zA-Z0-9_-]+$/.test(environment ?? '')) {
              throw new Error('Invalid Infisical environment slug');
            }
            const secretPath = process.env.INFISICAL_SECRET_PATH;
            if (!/^\/[a-zA-Z0-9_\/-]*$/.test(secretPath ?? '')) {
              throw new Error('Invalid Infisical secret path');
            }
            const requestUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
            const requestToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
            if (!requestUrl || !requestToken) {
              throw new Error('GitHub OIDC token request is unavailable');
            }
            const oidcUrl = new URL(requestUrl);
            oidcUrl.searchParams.set('audience', process.env.OIDC_AUDIENCE);
            const oidcResponse = await fetch(oidcUrl, {
              headers: { Authorization: `Bearer ${requestToken}` }
            });
            if (!oidcResponse.ok) {
              throw new Error(`GitHub OIDC failed (HTTP ${oidcResponse.status})`);
            }
            const oidcToken = (await oidcResponse.json()).value;
            if (!oidcToken) throw new Error('Missing OIDC token');

            const loginResponse = await fetch('https://eu.infisical.com/api/v1/auth/oidc-auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ identityId, jwt: oidcToken })
            });
            if (!loginResponse.ok) {
              throw new Error(`Infisical OIDC login failed (HTTP ${loginResponse.status})`);
            }
            const accessToken = (await loginResponse.json()).accessToken;
            if (!accessToken) throw new Error('Infisical access token missing');

            const secretUrl = new URL('https://eu.infisical.com/api/v3/secrets/raw/LINEAR_API_KEY');
            secretUrl.searchParams.set('workspaceId', 'aeecdd39-9201-4f8f-9521-2b740f663659');
            secretUrl.searchParams.set('environment', environment);
            secretUrl.searchParams.set('secretPath', secretPath);
            secretUrl.searchParams.set('include_imports', 'true');
            const secretResponse = await fetch(secretUrl, {
              headers: { Authorization: `Bearer ${accessToken}` }
            });
            if (!secretResponse.ok) {
              // Best effort: list environment slugs (names only) to spot dev vs. development.
              const wsResponse = await fetch('https://eu.infisical.com/api/v1/workspace/aeecdd39-9201-4f8f-9521-2b740f663659', {
                headers: { Authorization: `Bearer ${accessToken}` }
              });
              if (wsResponse.ok) {
                const slugs = ((await wsResponse.json()).workspace?.environments ?? []).map(e => e.slug);
                console.error(`Available environment slugs: ${slugs.join(', ') || '(none)'}`);
              } else {
                console.error(`Environment slugs not readable (HTTP ${wsResponse.status})`);
              }
              throw new Error(`Infisical single-secret read failed (HTTP ${secretResponse.status}) for environment "${environment}", path "${secretPath}"; check environment, folder, project, and read permissions`);
            }
            const result = await secretResponse.json();
            if (typeof result.secret?.secretValue !== 'string' || result.secret.secretValue.length === 0) {
              throw new Error('LINEAR_API_KEY missing or empty in specified environment/path');
            }
            console.log('Infisical single-secret read: SUCCESS (secret not printed)');
          })().catch(error => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE
