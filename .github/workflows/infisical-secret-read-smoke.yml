name: Infisical single-secret read smoke test

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Infisical environment slug to test (default: dev)"
        type: string
        required: true
        default: dev

permissions:
  contents: read
  id-token: write

jobs:
  secret-read-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read only LINEAR_API_KEY from Infisical (never print value)
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          oidc-audience: https://github.com/siinanXD
          domain: https://eu.infisical.com
          project-id: aeecdd39-9201-4f8f-9521-2b740f663659
          env-slug: ${{ inputs.environment }}
          secret-path: /
          secret-name: LINEAR_API_KEY
      - name: Verify secret exists without showing its contents
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${LINEAR_API_KEY:-}" ]]; then
            echo 'Infisical secret read: FAILED (missing or empty)'
            exit 1
          fi
          echo 'Infisical secret read: SUCCESS (value not printed)'
