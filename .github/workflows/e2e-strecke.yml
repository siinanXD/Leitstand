# E2E-Strecke (SIN-1073): Stationen je Issue von Todo bis Done, Kennzahlen in loop_snapshot.e2e.
name: e2e-strecke
on:
  schedule:
    - cron: "35 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur ins Log schreiben"
        type: boolean
        default: true
concurrency:
  group: e2e-strecke
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  e2e-strecke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsx scripts/e2e/strecke.ts
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          GH_TOKEN: ${{ secrets.AGENT_WORKFLOW_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
