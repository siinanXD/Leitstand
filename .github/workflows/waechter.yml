# Projekt-Wächter (SIN-419).
# Stündlich und von Hand. Je Linear-Projekt „In Progress“ mit GitHub-Link: Schlange füllen, Hänger reparieren,
# Tages-Update; neue Projekte einrichten. Trockenlauf: von Hand mit Haken dry_run.
name: waechter

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur anzeigen, nichts ändern"
        type: boolean
        # SIN-965: Der Takt kommt per workflow_dispatch ohne Eingaben; mit true lief der Wächter nur trocken.
        default: false

concurrency:
  group: waechter
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  waechter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Projekte prüfen
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GH_TOKEN: ${{ secrets.AGENT_WORKFLOW_TOKEN }}
          # loop_snapshot-Zeile leitstand (SIN-616): ohne beide nur eine Warnung im Log.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LOOP_MAX_PARALLEL: ${{ vars.LOOP_MAX_PARALLEL || '1' }}
          LEITSTAND_MAX_PARALLEL: ${{ vars.LEITSTAND_MAX_PARALLEL || '2' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: npx tsx scripts/waechter/waechter.ts
      # SIN-897: Kennzahl Durchstich als Tageswert in loop_snapshot. Ein Fehler hier stoppt den Wächter nicht.
      - name: Durchstich berechnen
        continue-on-error: true
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GH_TOKEN: ${{ secrets.AGENT_WORKFLOW_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: npx tsx scripts/kennzahlen/durchstich.ts
      # SIN-967: GitHub lässt geplante Läufe oft aus (abnahme.yml lief 41-mal in 7 Tagen statt stündlich).
      # Der Wächter läuft per externem Takt alle 15 Min und stößt die Abnahme an, wenn ihr letzter Lauf älter als 55 Min ist.
      - name: Abnahme anstoßen, wenn der Stundenlauf ausfiel
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AGENT_WORKFLOW_TOKEN }}
        run: |
          zuletzt=$(gh api "repos/${{ github.repository }}/actions/workflows/abnahme.yml/runs?per_page=1" -q '.workflow_runs[0].created_at')
          if [ -z "$zuletzt" ] || [ $(( $(date +%s) - $(date -d "$zuletzt" +%s) )) -gt 3300 ]; then
            gh workflow run abnahme.yml --repo "${{ github.repository }}" -f dry_run=false
          else
            echo "Abnahme lief zuletzt $zuletzt, nichts zu tun"
          fi
