name: anwalt
on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "src/lib/storage/**"
      - "**/*tracking*"
      - "**/*analytics*"
      - "**/*prompt*"
      - "**/*werbemittel*"
      - "src/app/datenschutz/**"
      - "src/app/impressum/**"
      - "src/app/ki-hinweis/**"
      - "docs/recht/**"
  schedule:
    - cron: "0 5 1 * *" # monatlich am 1., 07:00 Berlin (Sommerzeit)
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  pruefen:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - id: lauf
        run: npx tsx scripts/anwalt/anwalt.ts "origin/${{ github.base_ref }}"
        continue-on-error: true
      - name: Kommentar und Label
        env:
          GH_TOKEN: ${{ secrets.AGENT_WORKFLOW_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body-file anwalt-kommentar.md
          if [ "${{ steps.lauf.outcome }}" = "failure" ]; then
            gh pr edit "${{ github.event.pull_request.number }}" --add-label needs-human
          fi
  avv:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - id: lauf
        run: npx tsx scripts/anwalt/anwalt.ts --avv | tee avv-log.txt
        continue-on-error: true
      - name: Issue für Sinan
        if: steps.lauf.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Recht: AVV-Liste hat Lücken" --label sinan --body-file avv-log.txt
