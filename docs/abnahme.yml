# Abnahme-Proben (SIN-626): je Punkt der Fertig-Liste eine unabhängige Live-Prüfung. Stündlich durch scripts/abnahme/abnahme.ts.
# Regel: kein Issue gilt als fertig ohne grüne Probe; wer baut, schreibt die Probe mit.
# Felder: id (einmalig), produkt (wie project in loop_events), titel (Klartext, steht im Leitstand), art, dazu je Art:
#   http    url, status (Standard 200), enthaelt (Text in der Antwort, optional)
#   db      rest (lesende Abfrage auf die REST-Schnittstelle), mindestens (Zeilen, Standard 1),
#           zeitfeld + max_alter_min (jüngste Zeile höchstens so alt, Standard 60), nicht_leer (Feld mit Inhalt)
#   datei   pfad (im Checkout), enthaelt (optional)
#   github  repo, pfad, enthaelt (optional); liest mit AGENT_WORKFLOW_TOKEN
#   rolle   (optional, jede Art) Schritt aus docs/autonomy/rollen.json; hat die Rolle takt aus, wird die Probe übersprungen (SIN-941)
# Adressen als ${NAME} werden aus der Umgebung ersetzt; fehlt der Wert, ist die Probe rot ("Nicht geprüft").

